<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>English Words</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#667eea,#764ba2);
}

.wrap{max-width:700px;margin:40px auto;padding:20px;}

.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  margin-bottom:20px;
}

h2{margin-top:0}

input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.primary{background:#667eea;color:#fff}
.danger{background:#ff6b6b;color:#fff}

.hidden{display:none}

/* LIST (ВОЗВРАЩЕН НОРМАЛЬНЫЙ) */
.word-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#f7f7ff;
  border-radius:10px;
  margin-bottom:8px;
}

/* TRAIN */
#train{
  display:flex;
  flex-direction:column;
  gap:10px;
}

#cardBox{
  font-size:26px;
  font-weight:bold;
  text-align:center;
  padding:20px;
  background:#f3f4ff;
  border-radius:14px;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ⭐ */
.fav-btn{
  width:auto;
  padding:6px 10px;
  font-size:12px;
  border-radius:8px;
  background:#ddd;
}

.fav-btn.active{
  background:#ffd54f;
}

/* progress */
.progress{
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#667eea;
  width:0%;
}
</style>
</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div id="login-view" class="card">
<h2>🔐 Вход</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<button id="loginBtn" class="primary">Войти</button>
<div id="loginError"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<button id="logoutBtn" class="danger">Выйти</button>

<div class="card">
<h2>📱 Меню</h2>
<button onclick="show('add')">➕ Добавить</button>
<button onclick="show('list')">📚 Список</button>
<button onclick="show('train')">🧠 Тренировка</button>
<button onclick="show('fav')">⭐ Избранное</button>
</div>

<!-- ADD -->
<div id="add" class="card hidden">
<h2>➕ Добавить</h2>
<input id="word" placeholder="English">
<input id="translation" placeholder="Перевод">
<button id="saveBtn" class="primary">Сохранить</button>
</div>

<!-- LIST -->
<div id="listView" class="card hidden">
<h2>📚 Список слов</h2>
<div id="list"></div>
</div>

<!-- TRAIN -->
<div id="train" class="card hidden">

<h2>🧠 Тренировка</h2>

<div id="cardBox"></div>

<!-- ⭐ -->
<button id="favBtn" onclick="toggleFavTrain()">⭐</button>

<input id="answer" placeholder="Ответ">

<button onclick="checkAnswer()" class="primary">Проверить</button>
<button onclick="nextCard()">Следующее</button>

<div class="progress">
  <div id="progressBar" class="progress-bar"></div>
</div>

<div id="result"></div>

</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyCwACXrUWvN6hn6uvFcdXFAMmmOLr4Oa8c",
  authDomain:"englishwords-d601c.firebaseapp.com",
  databaseURL:"https://englishwords-d601c-default-rtdb.firebaseio.com",
  projectId:"englishwords-d601c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const wordsRef = ref(db,'englishwords');

/* DOM */
const list = document.getElementById('list');
const cardBox = document.getElementById('cardBox');
const answer = document.getElementById('answer');
const result = document.getElementById('result');
const progressBar = document.getElementById('progressBar');
const favBtn = document.getElementById('favBtn');

const loginView = document.getElementById('login-view');
const appView = document.getElementById('app');

/* STATE */
let words=[];
let session=[];
let current=null;
let index=0;
let mode='all';
let correct=0;
let total=0;

/* LOGIN */
document.getElementById('loginBtn').onclick = async ()=>{
  await signInWithEmailAndPassword(auth,email.value,password.value);
};

document.getElementById('logoutBtn').onclick=()=>signOut(auth);

/* AUTH */
onAuthStateChanged(auth,user=>{
  if(user){
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    loadData(user);
  } else {
    loginView.classList.remove('hidden');
    appView.classList.add('hidden');
  }
});

/* NAV */
window.show=(v)=>{
  ['add','listView','train'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.add('hidden');
  });

  if(v==='add') document.getElementById('add').classList.remove('hidden');
  if(v==='list') document.getElementById('listView').classList.remove('hidden');

  if(v==='train'){
    mode='all';
    document.getElementById('train').classList.remove('hidden');
    start();
  }

  if(v==='fav'){
    mode='fav';
    document.getElementById('train').classList.remove('hidden');
    start();
  }
};

/* SAVE */
document.getElementById('saveBtn').onclick=async()=>{
  const user=auth.currentUser;

  await push(wordsRef,{
    word:word.value,
    translation:translation.value,
    uid:user.uid,
    fav:false
  });

  word.value='';
  translation.value='';
};

/* LOAD LIST (ОБЫЧНЫЙ СПИСОК НЕ СЛОМАН) */
function loadData(user){
  onValue(wordsRef,snap=>{
    list.innerHTML='';
    words=[];

    const data=snap.val();
    if(!data) return;

    Object.entries(data).forEach(([id,item])=>{
      if(item.uid!==user.uid) return;

      item.id=id;
      words.push(item);

      const div=document.createElement('div');
      div.className='word-card';

      div.innerHTML=`
        <span>
          <b>${item.word}</b> — ${item.translation}
        </span>

        <button class="fav-btn ${item.fav?'active':''}"
          onclick="toggleFav('${id}',${item.fav})">
          ⭐
        </button>
      `;

      list.appendChild(div);
    });
  });
}

window.toggleFav = async(id,fav)=>{
  await update(ref(db,'englishwords/'+id),{fav:!fav});
};

/* TRAIN */
function start(){

  let pool = words;

  if(mode==='fav'){
    pool = words.filter(w=>w.fav);
  }

  session = shuffle(pool);
  index=0;

  if(session.length===0){
    cardBox.textContent="Нет слов";
    return;
  }

  nextCard();
}

function shuffle(a){
  return a.map(v=>({v,r:Math.random()}))
    .sort((a,b)=>a.r-b.r)
    .map(x=>x.v);
}

function nextCard(){

  if(index>=session.length){
    cardBox.textContent="🏁 Конец";
    current=null;
    return;
  }

  current=session[index++];

  const rev=Math.random()>0.5;

  current.mode=rev?'ru-en':'en-ru';

  cardBox.textContent = rev
    ? current.translation
    : current.word;

  answer.value='';
  result.textContent='';

  renderFav();
}

function renderFav(){
  if(!current) return;
  favBtn.textContent = current.fav ? "⭐ Убрать из избранного" : "⭐ В избранное";
}

window.toggleFavTrain = async ()=>{
  if(!current) return;

  await update(ref(db,'englishwords/'+current.id),{
    fav: !current.fav
  });

  current.fav = !current.fav;
  renderFav();
};

window.checkAnswer=()=>{
  if(!current) return;

  const u=answer.value.trim().toLowerCase();

  const c=current.mode==='ru-en'
    ? current.word.toLowerCase()
    : current.translation.toLowerCase();

  total++;

  if(u===c){
    result.textContent="✅";
  } else {
    result.textContent="❌ "+c;
  }

  progressBar.style.width=(total?100:0)+'%';
};

window.nextCard=nextCard;

</script>

</body>
</html>
