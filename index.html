<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>English Words</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter, Arial;
  background:linear-gradient(135deg,#667eea,#764ba2);
}

.wrap{
  max-width:700px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  margin-bottom:20px;
}

h2{margin-top:0}

input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.primary{background:#667eea;color:#fff}
.danger{background:#ff6b6b;color:#fff}

.hidden{display:none}

/* LIST */
.word-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  border-radius:12px;
  background:#f7f7ff;
  margin-bottom:10px;
  gap:8px;
}

.word-card span{
  flex:1;
  font-size:15px;
}

.small-btn{
  width:auto;
  padding:6px 10px;
  font-size:12px;
  border-radius:8px;
}

.fav-btn{
  background:#ddd;
}

.fav-btn.active{
  background:#ffd54f;
}

/* TRAIN */
#train{
  display:flex;
  flex-direction:column;
  gap:10px;
}

#cardBox{
  font-size:26px;
  font-weight:700;
  text-align:center;
  padding:20px;
  background:#f3f4ff;
  border-radius:14px;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PROGRESS */
.progress{
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#667eea;
  width:0%;
}
</style>
</head>

<body>

<div class="wrap">

<!-- LOGIN -->
<div id="login-view" class="card">
<h2>🔐 Вход</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<button id="loginBtn" class="primary">Войти</button>
<div id="loginError" style="color:red"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<button id="logoutBtn" class="danger">Выйти</button>

<div class="card">
<h2>📱 Меню</h2>
<button onclick="show('add')">➕ Добавить</button>
<button onclick="show('list')">📚 Список</button>
<button onclick="show('train')">🧠 Тренировка</button>
<button onclick="show('favtrain')">⭐ Избранное</button>
</div>

<!-- ADD -->
<div id="add" class="card hidden">
<h2>➕ Добавить</h2>
<input id="word" placeholder="English">
<input id="translation" placeholder="Перевод">
<button id="saveBtn" class="primary">Сохранить</button>
</div>

<!-- LIST -->
<div id="listView" class="card hidden">
<h2>📚 Список</h2>
<div id="list"></div>
</div>

<!-- TRAIN -->
<div id="train" class="card hidden">

<h2>🧠 Тренировка</h2>

<div id="cardBox"></div>

<input id="answer" placeholder="Ответ">

<button onclick="checkAnswer()" class="primary">Проверить</button>
<button onclick="nextCard()">Следующее</button>

<div class="progress">
  <div id="progressBar" class="progress-bar"></div>
</div>

<div id="result"></div>

</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyCwACXrUWvN6hn6uvFcdXFAMmmOLr4Oa8c",
  authDomain:"englishwords-d601c.firebaseapp.com",
  databaseURL:"https://englishwords-d601c-default-rtdb.firebaseio.com",
  projectId:"englishwords-d601c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const wordsRef = ref(db,'englishwords');

/* DOM */
const loginView = document.getElementById('login-view');
const appView = document.getElementById('app');

const email = document.getElementById('email');
const password = document.getElementById('password');

const word = document.getElementById('word');
const translation = document.getElementById('translation');

const list = document.getElementById('list');

const cardBox = document.getElementById('cardBox');
const answer = document.getElementById('answer');
const result = document.getElementById('result');
const progressBar = document.getElementById('progressBar');

/* STATE */
let words = [];
let session = [];
let index = 0;
let current = null;

let trainMode = 'all';
let correct = 0;
let total = 0;

/* LOGIN */
document.getElementById('loginBtn').onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth,email.value,password.value);
  } catch(e){
    document.getElementById('loginError').textContent = e.message;
  }
};

document.getElementById('logoutBtn').onclick = () => signOut(auth);

/* AUTH */
onAuthStateChanged(auth,user=>{
  if(user){
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    loadData(user);
  } else {
    loginView.classList.remove('hidden');
    appView.classList.add('hidden');
  }
});

/* NAV */
window.show = function(v){
  ['add','listView','train'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.classList.add('hidden');
  });

  if(v==='add') document.getElementById('add').classList.remove('hidden');
  if(v==='list') document.getElementById('listView').classList.remove('hidden');

  if(v==='train'){
    trainMode = 'all';
    document.getElementById('train').classList.remove('hidden');
    startSession();
  }

  if(v==='favtrain'){
    trainMode = 'fav';
    document.getElementById('train').classList.remove('hidden');
    startSession();
  }
};

/* SAVE */
document.getElementById('saveBtn').onclick = async () => {
  const user = auth.currentUser;

  await push(wordsRef,{
    word:word.value,
    translation:translation.value,
    uid:user.uid,
    fav:false
  });

  word.value='';
  translation.value='';
};

/* LOAD */
function loadData(user){
  onValue(wordsRef,snap=>{
    list.innerHTML='';
    words=[];

    const data = snap.val();
    if(!data) return;

    Object.entries(data).forEach(([id,item])=>{
      if(item.uid && item.uid!==user.uid) return;

      item.id=id;
      words.push(item);

      const div=document.createElement('div');
      div.className='word-card';

      div.innerHTML=`
        <span><b>${item.word}</b> — ${item.translation}</span>

        <button class="small-btn fav-btn ${item.fav?'active':''}"
          onclick="toggleFav('${id}',${item.fav})">
          ⭐
        </button>

        <button class="small-btn danger"
          onclick="del('${id}')">✕</button>
      `;

      list.appendChild(div);
    });
  });
}

window.del = id => remove(ref(db,'englishwords/'+id));

window.toggleFav = async (id,fav)=>{
  await update(ref(db,'englishwords/'+id),{
    fav:!fav
  });
};

/* SESSION */
function startSession(){
  let pool = words;

  if(trainMode==='fav'){
    pool = words.filter(w=>w.fav);
  }

  session = shuffle([...pool]);
  index = 0;

  if(session.length===0){
    cardBox.textContent = "Нет слов для тренировки";
    return;
  }

  nextCard();
}

/* SHUFFLE */
function shuffle(arr){
  return arr.map(v=>({v,r:Math.random()}))
    .sort((a,b)=>a.r-b.r)
    .map(x=>x.v);
}

/* NEXT */
function nextCard(){

  if(index>=session.length){
    cardBox.textContent="🎉 Тренировка завершена";
    current=null;
    return;
  }

  current = session[index++];

  const reverse = Math.random()>0.5;

  current.mode = reverse?'ru-en':'en-ru';

  cardBox.textContent = reverse
    ? current.translation
    : current.word;

  answer.value='';
  result.textContent='';
}

/* CHECK */
function checkAnswer(){
  if(!current) return;

  const user = answer.value.trim().toLowerCase();

  const correctAnswer =
    current.mode==='ru-en'
      ? current.word.toLowerCase()
      : current.translation.toLowerCase();

  total++;

  if(user===correctAnswer){
    correct++;
    result.textContent='✅';
  } else {
    result.textContent='❌ '+correctAnswer;
  }

  progressBar.style.width =
    (correct/total*100)+'%';
}

window.nextCard=nextCard;
window.checkAnswer=checkAnswer;

</script>
</body>
</html>
