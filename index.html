<!doctype html>

<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Английские слова</title>

<style>
  body{font-family:Arial; background:#f5f5f5; margin:0;}
  .wrap{max-width:900px;margin:auto;padding:20px;}
  input,button{padding:10px;margin:5px 0;}
  .hidden{display:none;}
  .card{background:#fff;padding:15px;border-radius:10px;margin-bottom:10px;}
</style>

</head>

<body>
<div class="wrap">

  <!-- LOGIN -->

  <div id="login-view" class="card">
    <h2>Вход</h2>
    <input id="email" type="text" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
    <div id="loginError" style="color:red;"></div>
  </div>

  <!-- APP -->

  <div id="app" class="hidden">

```
<button id="logoutBtn">Выйти</button>

<h2>Добавить слово</h2>
<input id="word" placeholder="English">
<input id="translation" placeholder="Перевод">
<button id="saveBtn">Сохранить</button>

<h2>Список</h2>
<div id="list"></div>
```

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";

import { 
  getDatabase, ref, push, onValue, remove 
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCwACXrUWvN6hn6uvFcdXFAMmmOLr4Oa8c",
  authDomain: "englishwords-d601c.firebaseapp.com",
  databaseURL: "https://englishwords-d601c-default-rtdb.firebaseio.com",
  projectId: "englishwords-d601c",
};

// INIT
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const wordsRef = ref(db, 'englishwords');

// DOM
const loginView = document.getElementById('login-view');
const appView = document.getElementById('app');

const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');

const logoutBtn = document.getElementById('logoutBtn');

const wordEl = document.getElementById('word');
const transEl = document.getElementById('translation');
const saveBtn = document.getElementById('saveBtn');
const listEl = document.getElementById('list');

// LOGIN
loginBtn.onclick = async () => {
  try{
    await signInWithEmailAndPassword(
      auth,
      emailEl.value,
      passEl.value
    );
  }catch(e){
    loginError.textContent = e.message;
  }
};

// LOGOUT
logoutBtn.onclick = () => signOut(auth);

// AUTH STATE
onAuthStateChanged(auth, user => {
  if(user){
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    loadData(user);
  }else{
    loginView.classList.remove('hidden');
    appView.classList.add('hidden');
  }
});

// SAVE WORD
saveBtn.onclick = async ()=>{
  const user = auth.currentUser;

  if(!user){
    alert("Не авторизован");
    return;
  }

  await push(wordsRef, {
    word: wordEl.value,
    translation: transEl.value,
    uid: user.uid,
    createdAt: Date.now()
  });

  wordEl.value='';
  transEl.value='';
};

// LOAD DATA
function loadData(user){
  onValue(wordsRef, snapshot=>{
    listEl.innerHTML = '';

    const data = snapshot.val();
    if(!data) return;

    Object.entries(data).forEach(([id,item])=>{
      
      if(item.uid !== user.uid) return;

      const div = document.createElement('div');
      div.className="card";

      div.innerHTML = `
        <b>${item.word}</b> — ${item.translation}
        <button onclick="del('${id}')">❌</button>
      `;

      listEl.appendChild(div);
    });
  });
}

// DELETE
window.del = async (id)=>{
  await remove(ref(db,'englishwords/'+id));
};

</script>

</body>
</html>
