<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>English Words</title>

<style>
  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family: Inter, Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:#333;
  }

  .wrap{
    max-width:700px;
    margin:40px auto;
    padding:20px;
  }

  .card{
    background:#fff;
    padding:20px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    margin-bottom:20px;
  }

  h2{
    margin-top:0;
  }

  input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:16px;
    transition:0.2s;
  }

  input:focus{
    border-color:#667eea;
    outline:none;
    box-shadow:0 0 0 2px rgba(102,126,234,0.2);
  }

  button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }

  #loginBtn, #saveBtn{
    background:#667eea;
    color:#fff;
  }

  #loginBtn:hover, #saveBtn:hover{
    background:#5a67d8;
  }

  #logoutBtn{
    background:#ff6b6b;
    color:#fff;
    margin-bottom:15px;
  }

  #logoutBtn:hover{
    background:#e55353;
  }

  .word-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    border-radius:12px;
    background:#f9f9ff;
    margin-bottom:10px;
    transition:0.2s;
  }

  .word-card:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
  }

  .word-text{
    font-size:18px;
  }

  .delete-btn{
    background:#ff6b6b;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
  }

  .delete-btn:hover{
    background:#e55353;
  }

  .hidden{
    display:none;
  }

</style>

</head>
<body>

<div class="wrap">

  <div id="login-view" class="card">
    <h2>🔐 Вход</h2>
    <input id="email" type="text" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">
    <button id="loginBtn">Войти</button>
    <div id="loginError" style="color:red;"></div>
  </div>

  <div id="app" class="hidden">

    <button id="logoutBtn">Выйти</button>

    <div class="card">
      <h2>➕ Добавить слово</h2>
      <input id="word" placeholder="English">
      <input id="translation" placeholder="Перевод">
      <button id="saveBtn">Сохранить</button>
    </div>

    <div class="card">
      <h2>📚 Список слов</h2>
      <div id="list"></div>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwACXrUWvN6hn6uvFcdXFAMmmOLr4Oa8c",
  authDomain: "englishwords-d601c.firebaseapp.com",
  databaseURL: "https://englishwords-d601c-default-rtdb.firebaseio.com",
  projectId: "englishwords-d601c",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const wordsRef = ref(db, 'englishwords');

const loginView = document.getElementById('login-view');
const appView = document.getElementById('app');

const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');

const wordEl = document.getElementById('word');
const transEl = document.getElementById('translation');
const saveBtn = document.getElementById('saveBtn');
const listEl = document.getElementById('list');

loginBtn.onclick = async () => {
  try{
    await signInWithEmailAndPassword(auth,emailEl.value,passEl.value);
  }catch(e){
    loginError.textContent = e.message;
  }
};

logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if(user){
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    loadData(user);
  }else{
    loginView.classList.remove('hidden');
    appView.classList.add('hidden');
  }
});

saveBtn.onclick = async ()=>{
  const user = auth.currentUser;
  if(!user) return;

  await push(wordsRef, {
    word: wordEl.value,
    translation: transEl.value,
    uid: user.uid,
    createdAt: Date.now()
  });

  wordEl.value='';
  transEl.value='';
};

function loadData(user){
  onValue(wordsRef, snapshot=>{
    listEl.innerHTML='';
    const data = snapshot.val();
    if(!data) return;

    Object.entries(data).forEach(([id,item])=>{
      if(item.uid !== user.uid) return;

      const div = document.createElement('div');
      div.className='word-card';

      div.innerHTML = `
        <div class="word-text"><b>${item.word}</b> — ${item.translation}</div>
        <button class="delete-btn" onclick="del('${id}')">✕</button>
      `;

      listEl.appendChild(div);
    });
  });
}

window.del = async (id)=>{
  await remove(ref(db,'englishwords/'+id));
};

</script>

</body>
</html>
