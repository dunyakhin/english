<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>English Words</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
}
.wrap{
  max-width:700px;
  margin:40px auto;
  padding:20px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  margin-bottom:20px;
}
h2{margin-top:0}

input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.primary{background:#667eea;color:#fff}
.primary:hover{background:#5a67d8}

.danger{background:#ff6b6b;color:#fff}
.danger:hover{background:#e55353}

.menu button{
  margin-bottom:10px;
}

.word-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-radius:12px;
  background:#f9f9ff;
  margin-bottom:10px;
}

.hidden{display:none}
</style>
</head>

<body>
<div class="wrap">

<!-- LOGIN -->
<div id="login-view" class="card">
  <h2>🔐 Вход</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <button id="loginBtn" class="primary">Войти</button>
  <div id="loginError" style="color:red"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <button id="logoutBtn" class="danger">Выйти</button>

  <!-- MENU -->
  <div id="menu" class="card menu">
    <h2>📱 Меню</h2>
    <button onclick="show('add')">➕ Добавить слово</button>
    <button onclick="show('list')">📚 Список слов</button>
    <button onclick="show('train')">🧠 Тренировка</button>
  </div>

  <!-- ADD -->
  <div id="add" class="card hidden">
    <h2>➕ Добавить слово</h2>
    <input id="word" placeholder="English">
    <input id="translation" placeholder="Перевод">
    <button id="saveBtn" class="primary">Сохранить</button>
  </div>

  <!-- LIST -->
  <div id="listView" class="card hidden">
    <h2>📚 Список слов</h2>
    <div id="list"></div>
  </div>

  <!-- TRAIN -->
  <div id="train" class="card hidden">
    <h2>🧠 Тренировка</h2>
    <div id="trainBox">Нажми "начать"</div>
    <button onclick="startTrain()" class="primary">Начать</button>
  </div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwACXrUWvN6hn6uvFcdXFAMmmOLr4Oa8c",
  authDomain: "englishwords-d601c.firebaseapp.com",
  databaseURL: "https://englishwords-d601c-default-rtdb.firebaseio.com",
  projectId: "englishwords-d601c",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const wordsRef = ref(db,'englishwords');

const loginView = document.getElementById('login-view');
const appView = document.getElementById('app');
const listEl = document.getElementById('list');

let words = [];

loginBtn.onclick = async ()=>{
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
  }catch(e){loginError.textContent=e.message}
}

logoutBtn.onclick = ()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  if(user){
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
    loadData(user);
  }else{
    loginView.classList.remove('hidden');
    appView.classList.add('hidden');
  }
});

function show(view){
  document.getElementById('add').classList.add('hidden');
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('train').classList.add('hidden');

  if(view==='add') document.getElementById('add').classList.remove('hidden');
  if(view==='list') document.getElementById('listView').classList.remove('hidden');
  if(view==='train') document.getElementById('train').classList.remove('hidden');
}

saveBtn.onclick = async ()=>{
  const user = auth.currentUser;
  if(!user) return;

  await push(wordsRef,{
    word:word.value,
    translation:translation.value,
    uid:user.uid
  });

  word.value='';
  translation.value='';
}

function loadData(user){
  onValue(wordsRef,snap=>{
    listEl.innerHTML='';
    words=[];

    const data=snap.val();
    if(!data) return;

    Object.entries(data).forEach(([id,item])=>{

      words.push(item);

      const div=document.createElement('div');
      div.className='word-card';
      div.innerHTML=`
        <span><b>${item.word}</b> — ${item.translation}</span>
        <button onclick="del('${id}')">✕</button>
      `;
      listEl.appendChild(div);
    });
  });
}

window.del = id=> remove(ref(db,'englishwords/'+id));

// TRAIN
function startTrain(){
  if(words.length===0){
    trainBox.textContent='Нет слов';
    return;
  }

  const w = words[Math.floor(Math.random()*words.length)];
  trainBox.textContent = w.word + ' → ?';

  setTimeout(()=>{
    trainBox.textContent = w.word + ' → ' + w.translation;
  },2000);
}
window.startTrain = startTrain;
window.show = show;

</script>
</body>
</html>
